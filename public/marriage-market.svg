<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Two intertwined wedding rings</title>
  <desc id="desc">A dark editorial illustration of two intertwined rings on a soft green background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14231d"/>
      <stop offset=".52" stop-color="#274437"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4ad"/>
      <stop offset=".35" stop-color="#dcb850"/>
      <stop offset=".7" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#a9781f"/>
